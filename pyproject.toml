[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnist-digit-recognition"
version = "1.0.0"
description = "A complete, tested ML pipeline and interactive Gradio demo for MNIST handwritten digit classification."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Shahoud" }]
keywords = ["machine-learning", "scikit-learn", "mnist", "gradio", "computer-vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "scikit-learn>=1.5,<2.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<0.14",
    "scikit-image>=0.22,<0.26",
    "pillow>=12.3,<13.0",
    "joblib>=1.3,<2.0",
    "huggingface-hub>=0.24",
    "gradio>=6.16,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.4,<1.0",
    "black>=24.3,<25.0",
    "pre-commit>=3.7,<5.0",
    "nbstripout>=0.7,<0.8",
    "pip-audit>=2.7,<3.0",
]

[project.urls]
Homepage = "https://github.com/Shahoud867/MNIST_Digit_Recognition"
Issues = "https://github.com/Shahoud867/MNIST_Digit_Recognition/issues"
Changelog = "https://github.com/Shahoud867/MNIST_Digit_Recognition/blob/main/CHANGELOG.md"

[project.scripts]
mnist-train = "mnist_digit_recognition.cli:main_train"
mnist-serve = "mnist_digit_recognition.cli:main_serve"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=mnist_digit_recognition --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src/mnist_digit_recognition"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mnist_digit_recognition"]
